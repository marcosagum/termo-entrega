<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a10f12">
<meta name="robots" content="noindex">
<title>Termo de Entrega</title>
<link rel="icon" href="/logo_gl.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f5f3; --card:#ffffff; --ink:#0a0a0a; --muted:#717784; --line:#e6e8ec; --ghost:#d7dae1;
  --band:#a10f12; --brand:#e11518; --brand-deep:#a10f12; --brand-light:#ed7374;
  --note-bg:#fdecec; --ok:#15803d; --ok-bg:#e4f4ea; --warn:#b45309; --warn-bg:#fdf0da; --chip:#eeece9; --focus:#ed7374;
  --info:#1d4ed8; --info-bg:#e6edfc;
  --r-card:24px; --r-pill:999px; --r-field:12px;
  --f:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.comrodape{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* topo */
.band{position:sticky;top:0;z-index:8;background:var(--band);color:#fff;padding:env(safe-area-inset-top,0px) 16px 0}
.band-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:64px;padding-block:10px}
.mark{width:44px;height:44px;flex:none;border-radius:8px;background:#fff}
.brand-t{font-size:15px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;line-height:1.1}
.brand-s{font-size:13px;opacity:.82;margin-top:3px}
.band-in .sp{flex:1}
.btn-band{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:var(--r-pill);padding:8px 14px;font-size:14px;font-weight:500;min-height:42px}
.btn-band:hover{background:rgba(255,255,255,.12)}
.tabs{max-width:960px;margin:0 auto;display:flex;gap:6px;padding:0 0 12px}
.tab{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:var(--r-pill);padding:8px 14px 8px 8px;background:rgba(255,255,255,.12);color:#fff;font-size:14px;font-weight:500;white-space:nowrap}
.tab .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);font-size:12px;font-weight:600}
.tab[aria-selected=true]{background:#fff;color:var(--band)}
.tab[aria-selected=true] .n{background:var(--band);color:#fff}
.tab.done .n{background:var(--ok);color:#fff}

main{max-width:960px;margin:0 auto;padding:20px 16px}
.pane{display:none}
.pane.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:22px;font-weight:600;margin:4px 0 4px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;margin-bottom:14px}
.card h3{font-size:16px;font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:8px}

/* entrar */
.login{max-width:400px;margin:12vh auto 0;padding:0 16px;text-align:center}
.login .mark{width:72px;height:72px;border-radius:16px;margin:0 auto 18px;display:block}
.login h1{font-size:22px;margin:0 0 6px}
.login p{color:var(--muted);margin:0 0 20px}
.login form{display:flex;flex-direction:column;gap:10px}
.erro{color:var(--brand);font-size:14px;min-height:20px}

/* campos */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid .full{grid-column:1/-1}
label.f{display:block}
label.f span{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px}
label.f span b{color:var(--brand)}
input[type=text],input[type=date],input[type=tel],input[type=email],input[type=password],input[type=search]{width:100%;border:1px solid var(--ghost);border-radius:var(--r-field);padding:12px 14px;font-size:16px;background:#fff;min-height:48px}
input:focus{border-color:var(--brand-light);outline:none;box-shadow:0 0 0 3px var(--note-bg)}
input.bad{border-color:var(--brand)}
input:disabled{background:var(--paper);color:var(--ink);opacity:1}

/* números */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left}
button.stat:hover{border-color:var(--brand-light)}
.stat[aria-pressed=true]{border-color:var(--brand);background:var(--note-bg)}
.stat b{display:block;font-size:26px;font-weight:600;line-height:1}
.stat small{color:var(--muted);font-size:13px}

.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ghost);background:#fff;border-radius:var(--r-pill);padding:9px 16px;font-size:14px;font-weight:500;min-height:42px;text-decoration:none;color:inherit}
.pill:hover{border-color:var(--brand-light)}
.pill.red{background:var(--brand);border-color:var(--brand);color:#fff}
.pill.green{background:var(--ok);border-color:var(--ok);color:#fff}

/* lista de termos */
.topo-lista{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.topo-lista input{flex:1}
.termos{display:grid;gap:10px}
.tc{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:14px 16px}
.tc:hover{border-color:var(--brand-light)}
.tc .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--chip);color:var(--muted)}
.tc .ic.ok{background:var(--ok-bg);color:var(--ok)}
.tc .ic.wait{background:var(--info-bg);color:var(--info)}
.tc .tx{flex:1;min-width:0}
.tc .ev{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .mt{color:var(--muted);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:var(--r-pill);padding:3px 10px;white-space:nowrap}
.tag svg{width:14px;height:14px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.no{background:var(--warn-bg);color:var(--warn)}
.tag.wait{background:var(--info-bg);color:var(--info)}
.tag.prep{background:var(--chip);color:var(--muted)}
.vazio{text-align:center;color:var(--muted);padding:40px 16px}
.vazio svg{width:40px;height:40px;stroke-width:1.25;margin-bottom:8px}

/* salas */
.blk{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 2px 10px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.room{position:relative;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:14px;min-height:88px;transition:border-color .15s,background .15s}
.room .c{font-size:18px;font-weight:600}
.room .p{color:var(--muted);font-size:13px;margin-top:2px}
.room .ck{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ghost);display:grid;place-items:center;color:transparent}
.room .ck svg{width:16px;height:16px;stroke-width:2.5}
.room[aria-pressed=true]{border-color:var(--brand);background:var(--note-bg)}
.room[aria-pressed=true] .ck{background:var(--brand);border-color:var(--brand);color:#fff}
.room .ph{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:6px}
.room .ph svg{width:14px;height:14px}
.det{margin-top:16px}
.det .card{padding:16px 18px}
.det h3{justify-content:space-between}
.det h3 small{font-weight:500;color:var(--muted);font-size:13px}
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.it .nm{flex:1;min-width:0}
.it .nm.chg::after{content:"alterado";margin-left:8px;font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:var(--r-pill);padding:2px 8px}
.it .nm.novo::after{content:"a mais";margin-left:8px;font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:var(--r-pill);padding:2px 8px}
.it .qv{font-weight:600;min-width:32px;text-align:right}
.step{display:inline-flex;align-items:center;border:1px solid var(--ghost);border-radius:var(--r-pill);overflow:hidden}
.step button{width:40px;height:40px;border:0;background:#fff;display:grid;place-items:center}
.step button:hover{background:var(--chip)}
.step b{min-width:32px;text-align:center;font-weight:600}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1}
.ibtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--ghost);background:#fff;flex:none}
.ibtn:hover{border-color:var(--brand-light);color:var(--brand)}

/* chaves e controles */
.krow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);min-height:52px}
.krow:first-of-type{border-top:0}
.kbt{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:6px 0}
.kbt .ck{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ghost);display:grid;place-items:center;color:transparent;flex:none}
.kbt .ck svg{width:16px;height:16px;stroke-width:2.5}
.kbt[aria-pressed=true] .ck{background:var(--brand);border-color:var(--brand);color:#fff}
.kbt[aria-pressed=false] .nm{color:var(--muted)}
.kq{color:var(--muted);font-size:13px;white-space:nowrap}
.dev-falta{color:var(--brand);font-weight:600}
.warnbox{background:var(--note-bg);color:var(--brand-deep);border-radius:var(--r-card);padding:18px 20px;margin-bottom:14px}
.warnbox h3{color:var(--brand-deep);margin:0 0 6px;display:flex;align-items:center;gap:8px;font-size:17px}
.warnbox p{margin:0 0 4px}

/* fotos */
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:12px}
.thumb{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--chip);padding:0;border:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .del{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(10,10,10,.65);color:#fff;display:grid;place-items:center}
.thumb .del svg{width:16px;height:16px}
.upl{display:inline-flex;align-items:center;gap:8px;border-radius:var(--r-pill);padding:10px 16px;background:var(--brand);color:#fff;font-weight:500;font-size:14px;cursor:pointer;min-height:44px}
.upl input{display:none}
.lb{position:fixed;inset:0;z-index:30;background:rgba(10,10,10,.92);display:grid;place-items:center;padding:16px}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.lb button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center}

/* termo */
.termo{font-size:15px}
.termo h4{font-size:14px;font-weight:600;margin:16px 0 6px;letter-spacing:.02em}
.termo h4:first-child{margin-top:0}
.termo p{margin:0 0 8px}
.termo .tx{background:var(--note-bg);border-radius:10px;padding:2px 6px;font-weight:600;color:var(--brand-deep)}
.aceite{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--ghost);border-radius:18px;padding:14px 16px;cursor:pointer;background:#fff;margin-bottom:14px}
.aceite input{width:24px;height:24px;margin:0;accent-color:var(--brand);flex:none}
.aceite.on{border-color:var(--ok);background:var(--ok-bg)}
.sigwrap{border:1.5px dashed var(--ghost);border-radius:18px;background:#fff;position:relative;touch-action:none}
.sigwrap canvas{display:block;width:100%;height:190px;touch-action:none;cursor:crosshair}
.sigwrap .hint{position:absolute;inset:auto 0 46px;text-align:center;color:var(--ghost);font-size:14px;pointer-events:none}
.sigwrap .ln{position:absolute;left:24px;right:24px;bottom:40px;border-bottom:1px solid var(--ghost);pointer-events:none}
.sigwrap.has .hint{display:none}
.sigimg{display:block;max-width:100%;height:120px;margin:0 auto}
.sigbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap}
.sigbar small{color:var(--muted)}
.miss{background:var(--warn-bg);color:var(--warn);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.miss b{display:block;margin-bottom:4px}
.miss ul{margin:0;padding-left:18px}
.miss a{color:inherit;font-weight:600}
.okbox{background:var(--ok-bg);color:var(--ok);border-radius:var(--r-card);padding:20px;margin-bottom:14px}
.okbox h3{color:var(--ok);margin:0 0 6px;display:flex;align-items:center;gap:8px;font-size:18px}
.okbox p{margin:0 0 4px;color:#14532d}
.codigo{font-family:ui-monospace,Consolas,monospace;font-size:13px;letter-spacing:.06em;background:#fff;border-radius:10px;padding:6px 10px;display:inline-block;margin-top:6px;color:var(--ink);word-break:break-all}
.waitbox{background:var(--info-bg);color:var(--info);border-radius:var(--r-card);padding:18px 20px;margin-bottom:14px;display:flex;gap:12px;align-items:flex-start}
.waitbox p{margin:2px 0 0;color:#1e3a8a;font-size:14px}
.acoes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.acao{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:16px;min-height:110px}
.acao:hover{border-color:var(--brand-light)}
.acao .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--note-bg);color:var(--brand)}
.acao b{font-size:15px}
.acao small{color:var(--muted);font-size:13px;line-height:1.3}
.acao.wa .ic{background:#e7f6ec;color:#15803d}

/* rodapé fixo */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:9;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.foot-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:10px}
.foot .prog{flex:1;min-width:0}
.foot .prog small{display:block;color:var(--muted);font-size:12px}
.bar{height:6px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:6px;max-width:220px}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-pill);padding:12px 20px;font-weight:600;font-size:15px;border:1px solid var(--ghost);background:#fff;min-height:48px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-deep)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.wide{width:100%}
.salvo{font-size:12px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;border-radius:var(--r-pill);padding:10px 18px;font-size:14px;z-index:40;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* cliente */
.cli-sala{border-top:1px solid var(--line);padding:10px 0}
.cli-sala:first-of-type{border-top:0}
.cli-sala summary{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;list-style:none;font-weight:600;min-height:40px}
.cli-sala summary::-webkit-details-marker{display:none}
.cli-sala summary small{color:var(--muted);font-weight:500}
.cli-sala summary svg{transition:transform .2s}
.cli-sala[open] summary svg{transform:rotate(180deg)}
.cli-sala .it{padding:6px 0}
.ident{background:var(--paper);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px}

@media (max-width:600px){
  .grid{grid-template-columns:1fr}
  .brand-s{display:none}
  .btn-band span{display:none}
  .btn-band{padding:9px}
  .tabs{gap:4px}
  .tab{flex:1;justify-content:center;gap:5px;padding:6px 8px 6px 6px;font-size:13px}
  .tab .n{width:20px;height:20px;font-size:11px}
  .rooms{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat b{font-size:22px}
  .btn{padding:12px 16px}
  .foot .prog small{display:none}
  .acoes{grid-template-columns:1fr}
  .acao{flex-direction:row;align-items:center;min-height:0}
  .acao .tx2{display:flex;flex-direction:column}
}

/* impressão */
#print{display:none}
@page{size:A4;margin:12mm 12mm 14mm}
@media print{
  body{background:#fff;padding:0!important;font-size:11pt}
  body>*:not(#print){display:none!important}
  #print{display:block;-webkit-print-color-adjust:exact;print-color-adjust:exact;color:#0a0a0a}
  .pb{break-before:page}
  .pr-band{background:#a10f12;color:#fff;border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px}
  .pr-band img{width:40px;height:40px;border-radius:6px;background:#fff}
  .pr-band .t{font-size:13pt;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .pr-band .s{font-size:9pt;opacity:.85}
  .pr-band .no{margin-left:auto;text-align:right;font-size:9pt}
  .pr-dados{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;margin:10px 0 2px;font-size:10pt}
  .pr-dados div{border-bottom:1px solid #e6e8ec;padding:4px 0}
  .pr-dados span{color:#717784;font-size:8.5pt;display:block}
  .pr-cl h4{font-size:10.5pt;margin:9px 0 3px;color:#a10f12}
  .pr-cl p{margin:0 0 4px;font-size:9.6pt;text-align:justify}
  .pr-local{margin:10px 0 4px;font-size:10pt}
  .pr-sigs{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:8px;break-inside:avoid}
  .pr-sig img{height:62px;max-width:100%;display:block;margin:0 auto}
  .pr-sig .vz{height:62px}
  .pr-sig .l{border-top:1px solid #0a0a0a;padding-top:4px;font-size:9pt;text-align:center}
  .pr-sig .l b{display:block;font-size:10pt}
  .pr-reg{margin-top:12px;font-size:8.5pt;color:#555;border:1px solid #e6e8ec;border-radius:8px;padding:8px 10px;break-inside:avoid}
  .pr-reg code{font-family:Consolas,monospace;font-size:8pt;word-break:break-all;color:#0a0a0a}
  .pr-h{font-size:12pt;margin:14px 0 8px;color:#a10f12}
  .pr-salas{columns:2;column-gap:16px}
  .pr-sala{break-inside:avoid;margin-bottom:10px;border:1px solid #e6e8ec;border-radius:8px;overflow:hidden}
  .pr-sala .hd{background:#fdecec;padding:5px 9px;font-weight:600;font-size:10pt;display:flex;justify-content:space-between}
  .pr-sala table{width:100%;border-collapse:collapse;font-size:9pt}
  .pr-sala td{padding:3px 9px;border-top:1px solid #f0f0f0}
  .pr-sala td:last-child{text-align:right;width:40px;font-weight:600}
  .pr-sala .alt{color:#b45309;font-size:7.5pt}
  .pr-fs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
  .pr-fs img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:5px;display:block;break-inside:avoid}
  .pr-fh{font-weight:600;font-size:10pt;margin:8px 0 5px;break-after:avoid}
  .pr-rod{margin-top:14px;font-size:8pt;color:#717784;text-align:center}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div id="print"></div>

<script>
(function(){
"use strict";
var LOGO='/logo_gl.png';
var app=document.getElementById('app');

/* ================= utilidades ================= */

function api(met,url,corpo){
  return fetch(url,{method:met,headers:corpo?{'content-type':'application/json'}:{},body:corpo?JSON.stringify(corpo):undefined,credentials:'same-origin'})
    .then(function(r){
      if(r.status===204) return null;
      return r.json().catch(function(){return {};}).then(function(j){if(!r.ok){var e=new Error(j.erro||('Erro '+r.status));e.status=r.status;throw e;}return j;});
    });
}
function dataExt(iso){if(!iso)return '';var d=new Date(iso+'T12:00:00');return d.toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});}
function dataCurta(iso){if(!iso)return '';var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function hora(iso){if(!iso)return '';var d=new Date(iso);return d.toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo'})+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});}
function codFmt(c){return (c||'').slice(0,32).toUpperCase().replace(/(.{4})/g,'$1 ').trim();}
function pecasSala(s){return s.it.reduce(function(a,x){return a+(+x.q||0);},0);}
function salasOn(t){return Object.keys(t.salas).filter(function(id){return t.salas[id].on;}).map(function(id){return {id:id,s:t.salas[id]};});}
function nFotos(t){return Object.keys(t.fotos||{}).reduce(function(a,k){return a+(t.salas[k]&&t.salas[k].on?t.fotos[k].length:0);},0);}
function curto(nome){return nome.replace('Sala ','');}
function chavesOn(t){var c=t.chaves||{};return Object.keys(c).filter(function(id){return c[id].on;}).map(function(id){return {id:id,k:c[id]};});}
function qtdChave(k){return k.q+' '+(k.tipo==='controle'?(k.q===1?'controle':'controles'):(k.q===1?'chave':'chaves'));}
function nomeQtd(k){return k.q>1?k.q+' '+k.nome.replace(/^Controle/,'controles').replace(/^Chave/,'chaves'):k.nome;}
function faltasDev(d){return d?d.itens.filter(function(x){return x.dev<x.q;}):[];}
function faltaTxt(x){var n=x.q-x.dev;return n+'x '+x.nome;}

/* ================= assinatura na tela ================= */
function Pad(cv,wrap,inicial,aoMudar){
  var ctx=cv.getContext('2d'),drawing=false,last=null,img=inicial||null;
  function tam(){
    var r=cv.getBoundingClientRect();if(!r.width)return;
    var dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0a0a0a';ctx.lineWidth=2.4;
    if(img){var im=new Image();im.onload=function(){ctx.drawImage(im,0,0,r.width,r.height);};im.src=img;}
    wrap.classList.toggle('has',!!img);
  }
  function pt(e){var r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
  cv.addEventListener('pointerdown',function(e){e.preventDefault();drawing=true;last=pt(e);try{cv.setPointerCapture(e.pointerId);}catch(x){}ctx.beginPath();ctx.arc(last.x,last.y,1.1,0,7);ctx.fillStyle='#0a0a0a';ctx.fill();wrap.classList.add('has');});
  cv.addEventListener('pointermove',function(e){if(!drawing)return;var p=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;});
  function fim(){if(!drawing)return;drawing=false;img=cv.toDataURL('image/png');aoMudar&&aoMudar(img);}
  cv.addEventListener('pointerup',fim);cv.addEventListener('pointercancel',fim);
  var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){if(document.body.contains(cv))tam();},150);});
  requestAnimationFrame(tam);
  return {valor:function(){return img;},limpa:function(){img=null;ctx.clearRect(0,0,cv.width,cv.height);wrap.classList.remove('has');aoMudar&&aoMudar(null);}};
}

/* ================= fotos ================= */
function reduz(file){
  return new Promise(function(ok){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var M=1600,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,M/Math.max(w,h));
      var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
      var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',.78));
    };
    img.onerror=function(){URL.revokeObjectURL(url);ok(null);};
    img.src=url;
  });
}

  var d=document.createElement('div');d.className='lb';d.innerHTML='<img src="'+src+'" alt=""><button type="button" aria-label="Fechar">'+I(IC.x)+'</button>';

}

        x.s.it.map(function(i){return '<div class="it"><div class="nm">'+esc(i.n)+'</div><div class="qv">'+i.q+'</div></div>';}).join('')+

      '</details>';

  }
  function desenha(){
    var c=T.campos,L=salasOn(T),tot=L.reduce(function(a,x){return a+pecasSala(x.s);},0);
    var h=topo()+'<main>';
    if(T.assinatura){
      document.body.classList.remove('comrodape');
      h+='<div class="okbox"><h3>'+I(IC.shield)+'Termo assinado</h3><p>Assinado por <b>'+esc(c.resp)+'</b> em '+esc(hora(T.assinatura.em))+'.</p><p>Termo nº '+esc(T.numero)+' · '+esc(c.evento)+'</p><div class="codigo" title="Código de conferência">'+esc(codFmt(T.assinatura.codigo))+'</div></div>'+

        '<div class="card termo" style="margin-top:14px"><h4>EVENTO: '+esc(c.evento)+'</h4>'+clausulas(T,true)+'</div>'+
        '<div class="card"><h3>Salas entregues · '+L.length+' salas, '+tot+' peças</h3>'+salasHTML()+'</div>'+chavesHTML();

      return;
    }
    document.body.classList.add('comrodape');
    h+='<h2>Olá, '+esc((c.resp||'').split(' ')[0])+'</h2><p class="lead">Leia o termo de entrega dos camarins e salas de produção do evento <b>'+esc(c.evento)+'</b> e assine no fim da página.</p>'+
      '<div class="card"><h3>'+I(IC.cal)+'Dados do evento</h3><div class="grid">'+
        '<div><small style="color:var(--muted)">Evento</small><div><b>'+esc(c.evento)+'</b></div></div>'+
        '<div><small style="color:var(--muted)">Data do evento</small><div>'+(esc(dataCurta(c.dataEvento))||'—')+'</div></div>'+
        '<div><small style="color:var(--muted)">Responsável pelo evento</small><div>'+esc(c.resp)+'</div></div>'+
        '<div><small style="color:var(--muted)">Documento</small><div>'+esc(c.doc)+'</div></div>'+
      '</div></div>'+
      '<div class="card termo"><h4>TERMO DE ENTREGA E RESPONSABILIDADE · Nº '+esc(T.numero)+'</h4>'+clausulas(T,true)+'<p style="margin-top:14px;color:var(--muted)">Rio de Janeiro, '+esc(dataExt(c.dataTermo))+'</p></div>'+
      '<div class="card"><h3>'+I(IC.home)+'Salas entregues · '+L.length+' salas, '+tot+' peças</h3><p class="lead" style="margin-bottom:8px">Toque numa sala para ver os móveis e as fotos da entrega.</p>'+salasHTML()+'</div>'+chavesHTML()+
      '<div class="ident">Eu, <b>'+esc(c.resp)+'</b>, documento <b>'+esc(c.doc)+'</b>, responsável pelo evento <b>'+esc(c.evento)+'</b>, recebo as salas'+(chavesOn(T).length?', as chaves e os controles':'')+' acima nas condições descritas.</div>'+
      '<label class="aceite" id="aceiteBox"><input type="checkbox" id="aceite"><div><b>Li e concordo com este termo</b>'+esc(aceiteTexto(T).replace(/^Li e concordo com este termo/,''))+'</div></label>'+
      '<div class="card"><h3>'+I(IC.pen)+'Sua assinatura</h3>'+padHTML('Cli','Assine aqui com o dedo')+'<div class="sigbar"><small>'+esc(c.resp)+' · '+esc(c.doc)+'</small><button class="pill" type="button" id="limpar">'+I(IC.undo)+'Limpar</button></div></div>'+
      '</main><footer class="foot"><div class="foot-in"><div class="prog"><b id="pT">Leia e assine</b><small id="pS"></small></div><button class="btn pri" id="assinar" type="button">'+I(IC.pen)+'Assinar termo</button></div></footer>';
    app.innerHTML=h;
    pad=Pad($('#cCli'),$('#wCli'),null,estado);
    $('#limpar').onclick=function(){pad.limpa();};
    $('#aceite').onchange=function(e){aceite=e.target.checked;$('#aceiteBox').classList.toggle('on',aceite);estado();};
    $('#assinar').onclick=assinar;
    estado();
  }
  function estado(){
    var falta=[];if(!aceite)falta.push('marque "Li e concordo"');if(!pad||!pad.valor())falta.push('assine no quadro');
    var pT=$('#pT');if(!pT)return;
    pT.textContent=falta.length?'Falta: '+falta.join(' e '):'Tudo pronto';
  }
  function assinar(){
    if(enviando)return;
    if(!aceite){toast('Marque "Li e concordo" antes de assinar');$('#aceiteBox').scrollIntoView({behavior:'smooth',block:'center'});return;}
    if(!pad.valor()){toast('Faça a sua assinatura no quadro');$('#wCli').scrollIntoView({behavior:'smooth',block:'center'});return;}
    enviando=true;var b=$('#assinar');b.disabled=true;b.textContent='Assinando…';
    api('POST','/api/publico/'+chave+'/assinar',{aceite:true,img:pad.valor(),numero:T.numero,versao:T.versao}).then(function(j){
      T=j;window.scrollTo(0,0);desenha();toast('Termo assinado');
    }).catch(function(e){
      enviando=false;b.disabled=false;b.innerHTML=I(IC.pen)+'Assinar termo';toast(e.message,5000);
      if(e.status===409)setTimeout(carrega,2500);
    });
  }
  document.addEventListener('click',function(e){var b=e.target.closest('[data-lb]');if(b){lightbox(b.dataset.lb);}});
  carrega();
}

/* =====================================================================
   EQUIPE
   ===================================================================== */
var PAPEL=null,LISTA=[],FILTRO='todos',BUSCA='';
var E=null,tab=0,salvarT=null,salvando=false,pendente=false,padAre=null,poll=null;

function entrar(){
  document.body.classList.remove('comrodape');
  app.innerHTML='<div class="login"><img class="mark" src="'+LOGO+'" alt=""><h1>Termo de Entrega</h1><p>Camarins, salas e chaves · Farmasi Arena</p>'+
    '<form id="fl"><input type="password" id="senha" placeholder="Senha da equipe" autocomplete="current-password" required><button class="btn pri" type="submit">Entrar</button><div class="erro" id="erro"></div></form></div>';
  $('#senha').focus();
  $('#fl').onsubmit=function(e){e.preventDefault();
    api('POST','/api/entrar',{senha:$('#senha').value}).then(function(j){PAPEL=j.papel;rota();}).catch(function(x){$('#erro').textContent=x.message;});
  };
}
function topoEquipe(extra){
  return '<header class="band"><div class="band-in"><img class="mark" src="'+LOGO+'" alt=""><div><div class="brand-t">Termo de Entrega</div><div class="brand-s">Camarins, salas e chaves · Farmasi Arena</div></div><div class="sp"></div>'+(extra||'')+'</div>';
}

/* ---------- lista ---------- */
function statusDe(r){return r.assinadoEm?'ok':(r.linkEm?'wait':'prep');}
function lista(){
  pararPoll();E=null;
  document.body.classList.remove('comrodape');
  api('GET','/api/termos').then(function(j){LISTA=j;desenhaLista();}).catch(erroGeral);
}
function desenhaLista(){
  var n={todos:LISTA.length,prep:0,wait:0,ok:0};LISTA.forEach(function(r){n[statusDe(r)]++;});
  var q=BUSCA.trim().toLowerCase();
  var L=LISTA.filter(function(r){
    if(FILTRO==='abertos'&&r.assinadoEm)return false;
    if(FILTRO==='ok'&&!r.assinadoEm)return false;
    return !q||(r.evento+' '+r.resp+' '+r.numero).toLowerCase().indexOf(q)>=0;
  });
  app.innerHTML=topoEquipe('<button class="btn-band" id="sair" type="button" title="Sair">'+I(IC.out)+'<span>Sair</span></button>')+'</header>'+
    '<main><div class="stats">'+
      '<button class="stat" data-f="todos" aria-pressed="'+(FILTRO==='todos')+'"><b>'+n.todos+'</b><small>termos</small></button>'+
      '<button class="stat" data-f="abertos" aria-pressed="'+(FILTRO==='abertos')+'"><b>'+(n.prep+n.wait)+'</b><small>a assinar</small></button>'+
      '<button class="stat" data-f="ok" aria-pressed="'+(FILTRO==='ok')+'"><b>'+n.ok+'</b><small>assinados</small></button>'+
    '</div>'+
    '<div class="topo-lista"><input type="search" id="busca" placeholder="Buscar" aria-label="Buscar evento, responsável ou número" value="'+esc(BUSCA)+'"><button class="btn pri" id="novo" type="button">'+I(IC.plus)+'Novo termo</button></div>'+
    (L.length?'<div class="termos">'+L.map(function(r){
      var st=statusDe(r);
      var tag=st==='ok'?(r.faltou?'<span class="tag no">'+I(IC.key)+'Faltou '+r.faltou+(r.faltou===1?' item':' itens')+'</span>':
                         r.chaves&&!r.devolvidoEm?'<span class="tag wait">'+I(IC.key)+'Chaves a devolver</span>':'<span class="tag ok">'+I(IC.check)+'Assinado</span>'):st==='wait'?'<span class="tag wait">'+I(IC.clock)+'Aguardando assinatura</span>':'<span class="tag prep">Em preparo</span>';
      return '<button class="tc" type="button" data-abrir="'+r.id+'"><span class="ic '+st+'">'+I(st==='ok'?IC.fileok:IC.file)+'</span><span class="tx"><div class="ev">'+(esc(r.evento)||'<i style="color:var(--muted)">Sem nome</i>')+'</div>'+
        '<div class="mt">'+esc(r.numero)+(r.dataEvento?' · '+dataCurta(r.dataEvento):'')+(r.resp?' · '+esc(r.resp):'')+' · '+r.salas+' sala'+(r.salas===1?'':'s')+' · '+r.fotos+' foto'+(r.fotos===1?'':'s')+'</div></span>'+tag+'</button>';
    }).join('')+'</div>':'<div class="card vazio">'+I(IC.file)+'<div>'+(LISTA.length?'Nenhum termo com esse filtro.':'Nenhum termo ainda. Toque em <b>Novo termo</b> para começar.')+'</div></div>')+
    '</main>';
  $('#novo').onclick=function(){api('POST','/api/termos').then(function(t){location.hash='t='+t.id+'&a=0';}).catch(erroGeral);};
  $('#sair').onclick=function(){api('POST','/api/sair').then(function(){location.hash='';entrar();});};
  $('#busca').oninput=function(e){BUSCA=e.target.value;var p=e.target.selectionStart;desenhaLista();var b=$('#busca');b.focus();b.setSelectionRange(p,p);};
  $$('[data-f]').forEach(function(b){b.onclick=function(){FILTRO=b.dataset.f;desenhaLista();};});
  $$('[data-abrir]').forEach(function(b){b.onclick=function(){location.hash='t='+b.dataset.abrir+'&a='+(LISTA.find(function(r){return r.id===b.dataset.abrir;}).assinadoEm?3:0);};});
}

/* ---------- editor ---------- */
function abrir(id,a){
  pararPoll();
  api('GET','/api/termos/'+id).then(function(t){E=t;tab=a;montaEditor();}).catch(function(e){toast(e.message);location.hash='';});
}
function trancado(){return !!(E&&E.assinatura);}
function montaEditor(){
  document.body.classList.add('comrodape');
  app.innerHTML=topoEquipe('<button class="btn-band" id="volta" type="button">'+I(IC.left)+'<span>Termos</span></button>')+
    '<nav class="tabs" role="tablist">'+['Evento','Salas','Fotos','Assinar'].map(function(n,i){return '<button class="tab" role="tab" data-t="'+i+'"><span class="n">'+(i+1)+'</span>'+n+'</button>';}).join('')+'</nav></header>'+
    '<main><section class="pane" data-p="0"></section><section class="pane" data-p="1"></section><section class="pane" data-p="2"></section><section class="pane" data-p="3"></section></main>'+
    '<footer class="foot"><div class="foot-in"><div class="prog"><b id="pT"></b><small id="pS"></small><div class="bar"><i id="pB"></i></div></div>'+
    '<button class="btn" id="voltar" type="button">'+I(IC.left)+'Voltar</button><button class="btn pri" id="prox" type="button">Próximo'+I(IC.right)+'</button><button class="btn ok" id="pdf" type="button" hidden>'+I(IC.print)+'Gerar PDF</button></div></footer>';
  $('#volta').onclick=function(){location.hash='';};
  $$('.tab').forEach(function(b){b.onclick=function(){location.hash='t='+E.id+'&a='+b.dataset.t;};});
  $('#voltar').onclick=function(){location.hash='t='+E.id+'&a='+(tab-1);};
  $('#prox').onclick=proximo;
  $('#pdf').onclick=function(){imprimir(E,function(sala,n){return '/api/termos/'+E.id+'/fotos/'+sala+'/'+n;});};
  vai(tab);
}
function vai(i){
  tab=Math.max(0,Math.min(3,i));pararPoll();
  $$('.pane').forEach(function(p){p.classList.toggle('on',+p.dataset.p===tab);});
  [paneEvento,paneSalas,paneFotos,paneAssinar][tab]();
  rodape();window.scrollTo(0,0);
}
function etapaOk(i){
  var c=E.campos;
  if(i===0)return !!((c.evento||'').trim()&&(c.resp||'').trim()&&(c.doc||'').trim()&&c.dataTermo);
  if(i===1)return salasOn(E).length>0;
  if(i===2)return salasOn(E).length>0&&salasOn(E).every(function(x){return (E.fotos[x.id]||[]).length>0;});
  return !!E.assinatura;
}
function rodape(){
  $$('.tab').forEach(function(t,i){t.setAttribute('aria-selected',i===tab);t.classList.toggle('done',i!==tab&&etapaOk(i));});
  $('#pT').textContent=trancado()?'Assinado':'Etapa '+(tab+1)+' de 4';
  $('#pS').textContent=E.numero+(salvando||pendente?' · salvando…':' · salvo');
  $('#pB').style.width=([0,1,2,3].filter(etapaOk).length*25)+'%';
  $('#voltar').hidden=tab===0;$('#prox').hidden=tab===3;$('#pdf').hidden=tab!==3||!trancado();
}
function proximo(){
  if(tab===0&&!trancado()&&!etapaOk(0)){
    ['evento','resp','doc','dataTermo'].forEach(function(k){var el=$('[data-k="'+k+'"]');if(el&&!(E.campos[k]||'').trim())el.classList.add('bad');});
    toast('Preencha os campos com *');var f=$('input.bad');if(f)f.focus();return;
  }
  if(tab===1&&!etapaOk(1)){toast('Escolha pelo menos uma sala');return;}
  if(tab===2&&!trancado()&&!etapaOk(2)){toast('Há sala sem foto. Dá para seguir, mas a foto protege a cobrança.',4000);}
  location.hash='t='+E.id+'&a='+(tab+1);
}
function salvarJa(){
  clearTimeout(salvarT);
  if(salvando){pendente=true;return;}
  salvando=true;pendente=false;rodape();
  api('PUT','/api/termos/'+E.id,{campos:E.campos,salas:E.salas,chaves:E.chaves,assArena:E.assArena}).then(function(j){
    E.atualizadoEm=j.atualizadoEm;salvando=false;if(pendente)salvarJa();else rodape();
  }).catch(function(e){salvando=false;rodape();toast('Não salvou: '+e.message,5000);if(e.status===409)abrir(E.id,tab);});
}
function agenda(){pendente=true;rodape();clearTimeout(salvarT);salvarT=setTimeout(function(){pendente=false;salvarJa();},500);}
window.addEventListener('beforeunload',function(e){if(salvando||pendente){e.preventDefault();e.returnValue='';}});

function aviso(){return trancado()?'<div class="okbox" style="padding:14px 18px"><p style="margin:0">'+I(IC.shield,'vertical-align:-4px;margin-right:6px')+'Termo assinado em '+esc(hora(E.assinatura.at||E.assinatura.em))+'. Nada mais pode ser mudado.</p></div>':'';}

function paneEvento(){
  var dis=trancado()?' disabled':'';
  function f(k,rot,obr,tipo,cls,extra){return '<label class="f'+(cls?' '+cls:'')+'"><span>'+rot+(obr?' <b>*</b>':'')+'</span><input type="'+(tipo||'text')+'" data-k="'+k+'" value="'+esc(E.campos[k]||'')+'"'+dis+(extra||'')+'></label>';}
  $('[data-p="0"]').innerHTML=aviso()+'<h2>Dados do evento</h2><p class="lead">Quem recebe os camarins e as salas de produção.</p>'+
    '<div class="card"><h3>'+I(IC.cal)+'Evento</h3><div class="grid">'+f('evento','Nome do evento',1,'text','full',' placeholder="Ex.: Show Mariah Carey"')+f('dataEvento','Data do evento',0,'date')+f('dataTermo','Data do termo',1,'date')+'</div></div>'+
    '<div class="card"><h3>'+I(IC.user)+'Responsável pelo evento</h3><div class="grid">'+f('resp','Nome completo',1,'text','full',' autocomplete="off"')+f('doc','Documento (CPF ou RG)',1,'text','',' autocomplete="off"')+f('empresa','Empresa / produtora')+f('tel','Telefone (WhatsApp)',0,'tel','',' placeholder="(21) 99999-9999"')+f('email','E-mail',0,'email')+'</div></div>'+
    '<div class="card"><h3>'+I(IC.home)+'Entregue por (Farmasi Arena)</h3><div class="grid">'+f('arena','Nome de quem entrega',0,'text','full')+'</div></div>'+
    (PAPEL==='admin'?'<div style="text-align:center;margin:24px 0 8px"><button class="pill" type="button" id="apagar" style="color:var(--brand)">'+I(IC.trash)+'Apagar este termo</button></div>':'');
  $$('[data-k]').forEach(function(el){el.addEventListener('input',function(){E.campos[el.dataset.k]=el.value;el.classList.remove('bad');agenda();});});
  var ap=$('#apagar');
  if(ap)ap.onclick=function(){
    if(ap.dataset.c!=='1'){ap.dataset.c='1';ap.lastChild.textContent='Toque de novo para apagar'+(trancado()?' (termo assinado!)':'');setTimeout(function(){if(ap.isConnected){ap.dataset.c='';ap.lastChild.textContent='Apagar este termo';}},4000);return;}
    api('DELETE','/api/termos/'+E.id).then(function(){toast('Termo apagado');location.hash='';}).catch(erroGeral);
  };
}

function paneSalas(){
  var p=$('[data-p="1"]'),dis=trancado();
  var ids=Object.keys(E.salas);
  function cards(g){return ids.filter(function(id){return E.salas[id].g===g;}).map(function(id){
    var s=E.salas[id],nf=(E.fotos[id]||[]).length;
    return '<button class="room" type="button" data-room="'+id+'" aria-pressed="'+s.on+'"'+(dis?' disabled':'')+'><span class="ck">'+I(IC.check)+'</span><div class="c">'+esc(curto(s.nome))+'</div><div class="p">'+pecasSala(s)+' peças</div>'+(s.on?'<div class="ph">'+I(IC.cam)+nf+' foto'+(nf===1?'':'s')+'</div>':'')+'</button>';
  }).join('');}
  var L=salasOn(E),aj=L.reduce(function(a,x){return a+x.s.it.filter(function(i){return i.p==null||i.q!==i.p;}).length;},0);
  p.innerHTML=aviso()+'<h2>Salas entregues</h2><p class="lead">'+(dis?'Salas que o cliente recebeu.':'Toque nas salas que o cliente vai receber. Se alguma estiver diferente do padrão, ajuste a quantidade.')+'</p>'+
    '<div class="stats"><div class="stat"><b>'+L.length+'</b><small>salas</small></div><div class="stat"><b>'+L.reduce(function(a,x){return a+pecasSala(x.s);},0)+'</b><small>peças</small></div><div class="stat"><b>'+aj+'</b><small>ajustes</small></div></div>'+
    (dis?'':'<div class="pills"><button class="pill" data-sel="todas" type="button">'+I(IC.check)+'Todas</button><button class="pill" data-sel="C" type="button">Só camarins</button><button class="pill" data-sel="T" type="button">Só produção</button><button class="pill" data-sel="nenhuma" type="button">'+I(IC.x)+'Limpar</button></div>')+
    '<div class="blk">Camarins</div><div class="rooms">'+cards('C')+'</div><div class="blk">Salas de produção</div><div class="rooms">'+cards('T')+'</div>'+
    '<div class="blk">Chaves e controles</div><div class="card" style="padding:8px 18px">'+
      (dis?'':'<p class="lead" style="margin:8px 0 4px;font-size:14px">A chave de cada sala escolhida já vem marcada. Marque também o que mais for entregue.</p>')+
      Object.keys(E.chaves||{}).filter(function(id){return !dis||E.chaves[id].on;}).map(function(id){
        var k=E.chaves[id];
        return '<div class="krow"><button class="kbt" type="button" data-ch="'+id+'" aria-pressed="'+k.on+'"'+(dis?' disabled':'')+'><span class="ck">'+I(IC.check)+'</span><span class="nm">'+esc(k.nome)+'</span></button>'+
          (k.on?(dis||k.tipo==='chave'?'<span class="kq">'+qtdChave(k)+'</span>':
            '<div class="step"><button type="button" aria-label="Menos" data-chq="'+id+'|-1">'+I(IC.minus)+'</button><b>'+k.q+'</b><button type="button" aria-label="Mais" data-chq="'+id+'|1">'+I(IC.plus)+'</button></div>'):'')+'</div>';
      }).join('')+(dis&&!chavesOn(E).length?'<p class="lead" style="margin:8px 0">Nenhuma chave ou controle entregue.</p>':'')+
    '</div>'+
    '<div class="det">'+L.map(function(x){
      return '<div class="card"><h3>'+esc(x.s.nome)+'<small>'+pecasSala(x.s)+' peças</small></h3>'+
        x.s.it.map(function(i,k){
          var cls=i.p==null?' novo':(i.q!==i.p?' chg':'');
          return '<div class="it"><div class="nm'+cls+'">'+esc(i.n)+'</div>'+(dis?'<div class="qv">'+i.q+'</div>':
            '<div class="step"><button type="button" aria-label="Menos" data-q="'+x.id+'|'+k+'|-1">'+I(IC.minus)+'</button><b>'+i.q+'</b><button type="button" aria-label="Mais" data-q="'+x.id+'|'+k+'|1">'+I(IC.plus)+'</button></div>'+
            (i.p==null?'<button class="ibtn" type="button" aria-label="Tirar item" data-del="'+x.id+'|'+k+'">'+I(IC.trash)+'</button>':''))+'</div>';
        }).join('')+
        (dis?'':'<div class="add"><input type="text" placeholder="Item a mais nesta sala" data-addn="'+x.id+'"><button class="ibtn" type="button" aria-label="Adicionar item" data-add="'+x.id+'">'+I(IC.plus)+'</button></div>')+
      '</div>';
    }).join('')+'</div>';
  if(dis)return;
  function chaveDaSala(id){if(E.chaves&&E.chaves[id])E.chaves[id].on=E.salas[id].on;}
  $$('[data-room]',p).forEach(function(b){b.onclick=function(){var s=E.salas[b.dataset.room];s.on=!s.on;chaveDaSala(b.dataset.room);agenda();paneSalas();rodape();};});
  $$('[data-sel]',p).forEach(function(b){b.onclick=function(){var v=b.dataset.sel;ids.forEach(function(id){E.salas[id].on=v==='todas'||E.salas[id].g===v;chaveDaSala(id);});agenda();paneSalas();rodape();};});
  $$('[data-ch]',p).forEach(function(b){b.onclick=function(){var k=E.chaves[b.dataset.ch];k.on=!k.on;agenda();paneSalas();};});
  $$('[data-chq]',p).forEach(function(b){b.onclick=function(){var a=b.dataset.chq.split('|'),k=E.chaves[a[0]];k.q=Math.max(1,Math.min(20,k.q+(+a[1])));agenda();paneSalas();};});
  $$('[data-q]',p).forEach(function(b){b.onclick=function(){var a=b.dataset.q.split('|'),i=E.salas[a[0]].it[+a[1]];i.q=Math.max(0,Math.min(999,i.q+(+a[2])));agenda();paneSalas();};});
  $$('[data-del]',p).forEach(function(b){b.onclick=function(){var a=b.dataset.del.split('|');E.salas[a[0]].it.splice(+a[1],1);agenda();paneSalas();};});
  function add(id){var inp=$('[data-addn="'+id+'"]'),n=(inp.value||'').trim();if(!n){inp.focus();return;}E.salas[id].it.push({n:n.slice(0,80),q:1,p:null});agenda();paneSalas();var ni=$('[data-addn="'+id+'"]');if(ni)ni.focus();}
  $$('[data-add]',p).forEach(function(b){b.onclick=function(){add(b.dataset.add);};});
  $$('[data-addn]',p).forEach(function(inp){inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();add(inp.dataset.addn);}};});
}

function paneFotos(){
  var p=$('[data-p="2"]'),dis=trancado(),L=salasOn(E);
  var tot=0,com=0;L.forEach(function(x){var n=(E.fotos[x.id]||[]).length;tot+=n;if(n)com++;});
  function src(id,n){return '/api/termos/'+E.id+'/fotos/'+id+'/'+n;}
  p.innerHTML=aviso()+'<h2>Fotos da entrega</h2><p class="lead">O termo diz que as salas são entregues "nas condições registradas nas fotos anexadas". Tire pelo menos uma foto de cada sala, mostrando os móveis.</p>'+
    '<div class="stats"><div class="stat"><b>'+tot+'</b><small>fotos</small></div><div class="stat"><b>'+com+'</b><small>salas com foto</small></div><div class="stat"><b>'+(L.length-com)+'</b><small>salas sem foto</small></div></div>'+
    (!L.length?'<div class="card vazio">Escolha as salas na etapa 2 para tirar as fotos.<br><br><button class="pill red" type="button" id="irSalas">Ir para Salas</button></div>':
    L.map(function(x){
      var fs=E.fotos[x.id]||[];
      return '<div class="card"><h3 style="justify-content:space-between;flex-wrap:wrap">'+esc(x.s.nome)+(fs.length?'<span class="tag ok">'+I(IC.check)+fs.length+' foto'+(fs.length===1?'':'s')+'</span>':'<span class="tag no">sem foto</span>')+'</h3>'+
        (dis?'':'<label class="upl">'+I(IC.cam)+'Tirar ou escolher fotos<input type="file" accept="image/*" multiple data-foto="'+x.id+'"></label>')+
        (fs.length?'<div class="phgrid">'+fs.map(function(n){return '<div class="thumb"><img loading="lazy" src="'+src(x.id,n)+'" alt="" data-lb="'+src(x.id,n)+'">'+(dis?'':'<button class="del" type="button" aria-label="Tirar foto" data-delf="'+x.id+'|'+n+'">'+I(IC.x)+'</button>')+'</div>';}).join('')+'</div>':'')+
      '</div>';
    }).join(''));
  var ir=$('#irSalas');if(ir)ir.onclick=function(){location.hash='t='+E.id+'&a=1';};
  $$('[data-lb]',p).forEach(function(im){im.onclick=function(){lightbox(im.dataset.lb);};});
  if(dis)return;
  $$('[data-foto]',p).forEach(function(inp){inp.onchange=function(){
    var id=inp.dataset.foto,files=Array.prototype.slice.call(inp.files||[]);if(!files.length)return;
    toast('Enviando '+files.length+' foto'+(files.length===1?'':'s')+'…',60000);salvando=true;rodape();
    files.reduce(function(pr,f){return pr.then(function(){return reduz(f).then(function(img){
      if(!img)return;return api('POST','/api/termos/'+E.id+'/fotos/'+id,{img:img}).then(function(j){(E.fotos[id]=E.fotos[id]||[]).push(j.nome);E.atualizadoEm=j.atualizadoEm;});
    });});},Promise.resolve()).then(function(){toast('Fotos guardadas');}).catch(function(e){toast('Erro na foto: '+e.message,5000);}).then(function(){salvando=false;if(tab===2)paneFotos();rodape();});
  };});
  $$('[data-delf]',p).forEach(function(b){b.onclick=function(){
    var a=b.dataset.delf.split('|');
    api('DELETE','/api/termos/'+E.id+'/fotos/'+a[0]+'/'+a[1]).then(function(j){E.fotos[a[0]]=(E.fotos[a[0]]||[]).filter(function(n){return n!==a[1];});E.atualizadoEm=j.atualizadoEm;paneFotos();rodape();}).catch(erroGeral);
  };});
}

function faltandoE(){
  var c=E.campos,m=[];
  if(!(c.evento||'').trim())m.push(['Nome do evento',0]);
  if(!c.dataTermo)m.push(['Data do termo',0]);
  if(!(c.resp||'').trim())m.push(['Nome do responsável',0]);
  if(!(c.doc||'').trim())m.push(['Documento do responsável',0]);
  if(!salasOn(E).length)m.push(['Escolher pelo menos uma sala',1]);
  return m;
}
function linkCliente(){return location.origin+'/assinar/'+E.chave;}
function paneAssinar(){
  var p=$('[data-p="3"]'),c=E.campos,L=salasOn(E),tot=L.reduce(function(a,x){return a+pecasSala(x.s);},0);
  if(trancado()){
    var as=E.assinatura;
    p.innerHTML='<div class="okbox"><h3>'+I(IC.shield)+'Termo assinado</h3><p>Assinado por <b>'+esc(c.resp)+'</b> ('+esc(c.doc)+') em '+esc(hora(as.em))+'.</p>'+
      '<p style="font-size:13px">Aparelho: '+esc(as.aparelho||'—').slice(0,140)+'</p>'+
      '<div class="codigo" title="Código de conferência">'+esc(codFmt(as.codigo))+'</div>'+
      (as.confere?'<p style="margin-top:8px;font-size:13px">'+I(IC.check,'vertical-align:-5px;width:18px;height:18px')+' Conferido: o termo está igual ao que foi assinado.</p>':'<p style="margin-top:8px;font-size:13px;color:var(--brand)">Atenção: o conteúdo não bate com o código da assinatura.</p>')+'</div>'+
      '<div class="acoes">'+
        '<button class="acao" type="button" id="aPdf"><span class="ic">'+I(IC.print)+'</span><span class="tx2"><b>Gerar PDF</b><small>Termo, relação e fotos, com as assinaturas</small></span></button>'+
        '<button class="acao wa" type="button" id="aWaCopia"><span class="ic">'+I(IC.wa)+'</span><span class="tx2"><b>Mandar a cópia</b><small>Link da cópia assinada pelo WhatsApp</small></span></button>'+
        '<button class="acao" type="button" id="aCopiar"><span class="ic">'+I(IC.link)+'</span><span class="tx2"><b>Copiar link</b><small>Da cópia assinada do cliente</small></span></button>'+
      '</div>'+
      '<div class="card" style="margin-top:14px" id="cardAss"><h3>Assinaturas</h3><div class="grid"><div><img class="sigimg" src="'+as.img+'" alt=""><div style="text-align:center;border-top:1px solid var(--line);padding-top:6px"><b>'+esc(c.resp)+'</b><br><small style="color:var(--muted)">Responsável pelo evento</small></div></div>'+
        '<div>'+(E.assArena?'<img class="sigimg" src="'+E.assArena+'" alt="">':'<div style="height:120px"></div>')+'<div style="text-align:center;border-top:1px solid var(--line);padding-top:6px"><b>'+(esc(c.arena)||'—')+'</b><br><small style="color:var(--muted)">Entregue por · Farmasi Arena</small></div></div></div></div>';
    if(chavesOn(E).length){$('#cardAss').insertAdjacentHTML('beforebegin',devolucaoHTML());ligaDevolucao();}
    $('#aPdf').onclick=function(){$('#pdf').click();};
    $('#aWaCopia').onclick=function(){whats('Olá, '+(c.resp||'').split(' ')[0]+'! Segue a sua cópia do Termo de Entrega assinado ('+E.numero+', '+c.evento+'): '+linkCliente());};
    $('#aCopiar').onclick=function(){copiar(linkCliente());};
    return;
  }
  var m=faltandoE();
  p.innerHTML='<h2>Assinatura</h2><p class="lead">Confira o termo e escolha como o cliente vai assinar.</p>'+
    (m.length?'<div class="miss"><b>Falta para o cliente assinar:</b><ul>'+m.map(function(x){return '<li><a href="#t='+E.id+'&a='+x[1]+'">'+esc(x[0])+'</a></li>';}).join('')+'</ul></div>':'')+
    (E.linkEm&&!m.length?'<div class="waitbox">'+I(IC.clock)+'<div><b>Aguardando a assinatura do cliente</b><p>Link liberado em '+esc(hora(E.linkEm))+'. Esta tela atualiza sozinha quando ele assinar.</p></div></div>':'')+
    '<div class="acoes" style="margin-bottom:14px">'+
      '<button class="acao" type="button" id="aAqui"'+(m.length?' disabled':'')+'><span class="ic">'+I(IC.tablet)+'</span><span class="tx2"><b>Assinar neste aparelho</b><small>Entregue o celular ou tablet ao cliente</small></span></button>'+
      '<button class="acao wa" type="button" id="aWa"'+(m.length?' disabled':'')+'><span class="ic">'+I(IC.wa)+'</span><span class="tx2"><b>Mandar por WhatsApp</b><small>O cliente assina no celular dele'+(c.tel?'':' (sem telefone: escolha o contato)')+'</small></span></button>'+
      '<button class="acao" type="button" id="aLink"'+(m.length?' disabled':'')+'><span class="ic">'+I(IC.link)+'</span><span class="tx2"><b>Copiar link</b><small>Para mandar por e-mail ou outro app</small></span></button>'+
    '</div>'+
    '<div class="card"><h3>'+I(IC.pen)+'Assinatura de quem entrega (Farmasi Arena)</h3>'+padHTML('Are','Assine aqui')+'<div class="sigbar"><small>'+(esc(c.arena)||'Preencha o nome em Evento')+' · opcional, antes do cliente</small><button class="pill" type="button" id="limpaAre">'+I(IC.undo)+'Limpar</button></div></div>'+
    '<div class="card termo"><h4>O QUE O CLIENTE VAI LER</h4><h4>EVENTO: '+(esc(c.evento)||'—')+'</h4>'+clausulas(E,true)+
      '<h4>SALAS ENTREGUES</h4><p>'+(L.length?L.map(function(x){return esc(x.s.nome)+' ('+pecasSala(x.s)+')';}).join(', ')+' · '+tot+' peças · '+nFotos(E)+' fotos':'<i>Nenhuma sala escolhida.</i>')+'</p>'+
      '<h4>CHAVES E CONTROLES</h4><p>'+(chavesOn(E).length?esc(listaChaves(E)):'<i>Nenhum.</i>')+'</p>'+
      '<p style="margin-top:14px;color:var(--muted)">Rio de Janeiro, '+esc(dataExt(c.dataTermo))+'</p></div>';
  padAre=Pad($('#cAre'),$('#wAre'),E.assArena,function(v){E.assArena=v;agenda();});
  $('#limpaAre').onclick=function(){padAre.limpa();};
  function liberar(){return api('POST','/api/termos/'+E.id+'/link').then(function(j){E.linkEm=j.linkEm;return j;});}
  function antes(){ // garante que o que está na tela já foi salvo
    if(!salvando&&!pendente)return Promise.resolve();
    return new Promise(function(ok){clearTimeout(salvarT);pendente=false;salvarJa();var iv=setInterval(function(){if(!salvando&&!pendente){clearInterval(iv);ok();}},150);});
  }
  $('#aAqui').onclick=function(){antes().then(liberar).then(function(){location.href='/assinar/'+E.chave+'?equipe=1&t='+E.id;}).catch(erroGeral);};
  $('#aWa').onclick=function(){antes().then(liberar).then(function(){
    whats('Olá, '+(c.resp||'').split(' ')[0]+'! Aqui é da Farmasi Arena. Segue o Termo de Entrega dos camarins e salas de produção do evento '+c.evento+'. Por favor, leia e assine pelo link: '+linkCliente(),c.tel);
    paneAssinar();espera();
  }).catch(erroGeral);};
  $('#aLink').onclick=function(){antes().then(liberar).then(function(){copiar(linkCliente());paneAssinar();espera();}).catch(erroGeral);};
  if(E.linkEm)espera();
}
/* ---------- devolução das chaves e controles ---------- */
var DEV=null,padDev=null;
function devolucaoHTML(){
  var d=E.devolucao;
  if(d){
    var fd=faltasDev(d);
    return '<div class="'+(fd.length?'warnbox':'okbox')+'" style="margin-top:14px"><h3>'+I(IC.key)+(fd.length?'Devolução com falta':'Chaves e controles devolvidos')+'</h3>'+
      '<p>Devolvido por <b>'+esc(d.nome)+'</b>'+(d.doc?' ('+esc(d.doc)+')':'')+' em '+esc(hora(d.em))+(d.recebeu?', recebido por '+esc(d.recebeu):'')+'.</p>'+
      (fd.length?'<p><b>Não devolvido: '+esc(fd.map(faltaTxt).join(', '))+'.</b> Pela cláusula 4, o cliente arca com o custo.</p>':'<p>Tudo voltou.</p>')+
      '<div class="codigo" title="Código de conferência da devolução">'+esc(codFmt(d.codigo))+'</div>'+
      (d.confere?'':'<p style="margin-top:8px;font-size:13px;color:var(--brand)">Atenção: a devolução não bate com o código.</p>')+'</div>';
  }
  if(!DEV||DEV.id!==E.id){
    DEV={id:E.id,itens:{},nome:E.campos.resp||'',doc:E.campos.doc||'',recebeu:E.campos.arena||'',conf:false};
    chavesOn(E).forEach(function(x){DEV.itens[x.id]=0;});
  }
  function f(k,rot){return '<label class="f"><span>'+rot+'</span><input type="text" data-dk="'+k+'" value="'+esc(DEV[k])+'" autocomplete="off"></label>';}
  return '<div class="card" style="margin-top:14px" id="devCard"><h3>'+I(IC.key)+'Devolução das chaves e controles</h3>'+
    '<p class="lead" style="margin-bottom:10px">No fim da desmontagem, conte o que voltou. Quem devolve assina aqui, neste aparelho.</p>'+
    '<div class="pills"><button class="pill" type="button" id="devTudo">'+I(IC.check)+'Voltou tudo</button></div>'+
    '<div id="devRows"></div>'+
    '<div class="grid" style="margin-top:14px">'+f('nome','Quem devolve <b>*</b>')+f('doc','Documento (CPF ou RG)')+'<div class="full">'+f('recebeu','Recebido por (Farmasi Arena)')+'</div></div>'+
    '<div style="margin-top:14px">'+padHTML('Dev','Assinatura de quem devolve')+'<div class="sigbar"><small id="devQuem">'+esc(DEV.nome)+'</small><button class="pill" type="button" id="limpaDev">'+I(IC.undo)+'Limpar</button></div></div>'+
    '<p id="devRes" style="margin:14px 0 10px;font-weight:600"></p>'+
    '<button class="btn pri wide" type="button" id="devOk">'+I(IC.key)+'Registrar devolução</button></div>';
}
function ligaDevolucao(){
  if(E.devolucao)return;
  var CH=chavesOn(E);
  function linhas(){
    $('#devRows').innerHTML=CH.map(function(x){
      var v=DEV.itens[x.id],f=v<x.k.q;
      return '<div class="krow"><div class="nm" style="flex:1;min-width:0">'+esc(x.k.nome)+'<br><small class="'+(f?'dev-falta':'kq')+'">'+(f?'faltam '+(x.k.q-v)+' de '+x.k.q:'voltou')+'</small></div>'+
        '<div class="step"><button type="button" aria-label="Menos" data-dq="'+x.id+'|-1">'+I(IC.minus)+'</button><b>'+v+'</b><button type="button" aria-label="Mais" data-dq="'+x.id+'|1">'+I(IC.plus)+'</button></div></div>';
    }).join('');
    var fd=CH.filter(function(x){return DEV.itens[x.id]<x.k.q;});
    var r=$('#devRes');r.className=fd.length?'dev-falta':'';r.style.color=fd.length?'':'var(--ok)';
    r.textContent=fd.length?'Ainda não voltou: '+fd.map(function(x){return (x.k.q-DEV.itens[x.id])+'x '+x.k.nome;}).join(', '):'Tudo voltou.';
    DEV.conf=false;$('#devOk').lastChild.textContent='Registrar devolução';
    $$('[data-dq]').forEach(function(b){b.onclick=function(){var a=b.dataset.dq.split('|'),k=E.chaves[a[0]];DEV.itens[a[0]]=Math.max(0,Math.min(k.q,DEV.itens[a[0]]+(+a[1])));linhas();};});
  }
  linhas();
  padDev=Pad($('#cDev'),$('#wDev'),null,null);
  $('#limpaDev').onclick=function(){padDev.limpa();};
  $('#devTudo').onclick=function(){CH.forEach(function(x){DEV.itens[x.id]=x.k.q;});linhas();};
  $$('[data-dk]').forEach(function(el){el.oninput=function(){DEV[el.dataset.dk]=el.value;el.classList.remove('bad');if(el.dataset.dk==='nome')$('#devQuem').textContent=el.value;};});
  $('#devOk').onclick=function(){
    var b=$('#devOk');
    if(!DEV.nome.trim()){var n=$('[data-dk=nome]');n.classList.add('bad');n.focus();toast('Preencha o nome de quem devolve');return;}
    if(!padDev.valor()){toast('Falta a assinatura de quem devolve');$('#wDev').scrollIntoView({behavior:'smooth',block:'center'});return;}
    var fd=CH.filter(function(x){return DEV.itens[x.id]<x.k.q;});
    if(fd.length&&!DEV.conf){DEV.conf=true;b.lastChild.textContent='Registrar mesmo com falta';toast('Ainda falta item. Toque de novo para registrar assim; depois não muda mais.',5000);return;}
    b.disabled=true;
    api('POST','/api/termos/'+E.id+'/devolucao',{itens:DEV.itens,nome:DEV.nome,doc:DEV.doc,recebeu:DEV.recebeu,img:padDev.valor()}).then(function(t){
      E=t;DEV=null;toast(faltasDev(t.devolucao).length?'Devolução registrada com falta':'Devolução registrada');vai(3);
    }).catch(function(e){b.disabled=false;erroGeral(e);});
  };
}

function espera(){
  pararPoll();
  poll=setInterval(function(){
    if(!E||tab!==3||trancado()){pararPoll();return;}
    api('GET','/api/termos/'+E.id).then(function(t){if(t.assinatura){E=t;toast('O cliente assinou o termo',5000);vai(3);}}).catch(function(){});
  },5000);
}
function pararPoll(){if(poll){clearInterval(poll);poll=null;}}
function whats(msg,tel){
  var n=(tel||'').replace(/\D/g,'');if(n&&n.length<=11)n='55'+n;
  window.open('https://wa.me/'+(n||'')+'?text='+encodeURIComponent(msg),'_blank','noopener');
}
function copiar(t){
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('Link copiado');}).catch(function(){
    var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Link copiado');}catch(e){toast(t,8000);}a.remove();
  });
}
function erroGeral(e){if(e&&e.status===401){entrar();return;}toast((e&&e.message)||'Erro',5000);}

/* ---------- rotas ---------- */
function rota(){
  var h=new URLSearchParams(location.hash.slice(1));
  var id=h.get('t'),a=+(h.get('a')||0);
  if(id){
    if(E&&E.id===id&&$('.tabs')){vai(a);return;}
    abrir(id,a);return;
  }
  lista();
}
window.addEventListener('hashchange',function(){if(PAPEL)rota();});
api('GET','/api/eu').then(function(j){PAPEL=j.papel;rota();}).catch(function(e){if(e.status===401)entrar();else app.innerHTML='<main><div class="card vazio">Sem conexão com o servidor. Tente de novo.</div></main>';});
})();
</script>
</body>
